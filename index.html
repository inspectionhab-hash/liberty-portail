<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --a: #1f5f8b; --encre: #18212b; --gris: #66727f; --trait: #e2e6ea; --fond: #f5f6f8; --ok: #1e8a5e; --att: #e08a1e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--encre); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .haut { background: var(--a); color: #fff; padding: 18px 18px 22px; }
  .haut h1 { margin: 0; font-size: 20px; } .haut .s { opacity: .85; font-size: 14px; margin-top: 2px; }
  main { max-width: 760px; margin: -12px auto 40px; padding: 0 12px; }
  .carte { background: #fff; border: 1px solid var(--trait); border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(16,24,40,.06); }
  .etape { display: flex; gap: 12px; align-items: center; }
  .etape .n { width: 32px; height: 32px; border-radius: 50%; background: #eef1f4; display: grid; place-items: center; font-weight: 700; flex: none; color: var(--gris); }
  .etape.fait .n { background: var(--ok); color: #fff; } .etape.afaire .n { background: var(--a); color: #fff; }
  .etape .t { flex: 1; } .etape .t b { display: block; } .etape .t span { font-size: 13.5px; color: var(--gris); }
  button, .btn { font: inherit; border: 0; border-radius: 10px; padding: 11px 16px; background: var(--a); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  button.sec { background: #eef1f4; color: var(--encre); } button:disabled { opacity: .45; }
  label { display: block; font-size: 13.5px; color: var(--gris); margin: 10px 0 3px; }
  input, select, textarea { width: 100%; font: inherit; padding: 10px 11px; border: 1px solid #cfd6dd; border-radius: 9px; background: #fff; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; } @media (max-width: 520px) { .deux { grid-template-columns: 1fr; } }
  h2 { font-size: 17px; margin: 4px 0 6px; } h3 { font-size: 15px; margin: 18px 0 2px; }
  .muted { color: var(--gris); font-size: 14px; } .ok { color: var(--ok); font-weight: 600; }
  .case-a-cocher { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 15px; color: var(--encre); }
  .case-a-cocher input { width: 22px; height: 22px; flex: none; margin-top: 2px; }
  /* lecture et signature */
  #lecteur { position: fixed; inset: 0; background: #e9ecef; overflow-y: auto; z-index: 10; display: none; }
  #lecteur .entete { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--trait); padding: 10px 14px; display: flex; gap: 10px; align-items: center; z-index: 3; }
  #lecteur .entete b { flex: 1; font-size: 15px; }
  .page { position: relative; max-width: 900px; margin: 12px auto; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .page img { width: 100%; display: block; }
  .page .charge { padding: 120px 0; text-align: center; color: var(--gris); }
  .zone { position: absolute; border: 2px solid var(--att); background: rgba(255, 196, 0, .28); border-radius: 4px; cursor: pointer; display: grid; place-items: center; animation: pulse 1.4s infinite; }
  .zone::after { content: attr(data-quoi); position: absolute; top: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 700; color: #9a5b00; background: #fff4df; padding: 1px 6px; border-radius: 6px; margin-top: 2px; }
  .zone.faite { animation: none; border-color: transparent; background: transparent; }
  .zone.faite::after { content: none; }
  .zone img { max-width: 100%; max-height: 100%; }
  .zone.courante { outline: 3px solid var(--a); outline-offset: 2px; }
  @keyframes pulse { 50% { background: rgba(255, 196, 0, .55); } }
  #barre { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--trait); padding: 10px 14px; display: flex; gap: 10px; align-items: center; z-index: 3; }
  #barre .p { flex: 1; font-size: 14px; }
  /* tablette à dessin */
  #pad { position: fixed; inset: 0; background: rgba(15,22,30,.55); display: none; align-items: center; justify-content: center; z-index: 20; padding: 12px; }
  #pad .boite { background: #fff; border-radius: 14px; padding: 14px; width: 100%; max-width: 560px; }
  #pad canvas { width: 100%; height: 200px; border: 2px dashed #cfd6dd; border-radius: 10px; touch-action: none; background: #fff; display: block; }
  #pad .act { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .fichiers li { font-size: 14px; }
  .attente { text-align: center; padding: 60px 20px; color: var(--gris); }
  /* demande de réparation */
  .filtres { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .filtres button { background: #eef1f4; color: var(--encre); padding: 7px 12px; font-weight: 500; border-radius: 999px; }
  .filtres button.actif { background: var(--a); color: #fff; }
  .dr-item { border-top: 1px solid var(--trait); padding: 12px 0; }
  .dr-item .tete { display: flex; gap: 10px; align-items: flex-start; }
  .dr-item .tete input { width: 22px; height: 22px; flex: none; margin-top: 2px; }
  .dr-item .titre { font-weight: 600; } .dr-item .sec { font-size: 13px; color: var(--gris); }
  .dr-item .txt { font-size: 13.5px; color: #3c4752; margin-top: 3px; }
  .dr-grav { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; color: #fff; margin-right: 6px; }
  .dr-choix { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; margin: 6px 0 0 32px; } .dr-choix .plein { grid-column: 1 / -1; }
  @media (max-width: 520px) { .dr-choix { grid-template-columns: 1fr; margin-left: 0; } }
  .dr-total { position: sticky; bottom: 0; background: #fff; border-top: 2px solid var(--trait); padding: 12px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .dr-total b { flex: 1; }
</style>
</head>
<body>
<div class="haut"><h1 id="titre">Votre inspection</h1><div class="s" id="sous"></div></div>
<main id="m"><div class="attente">Chargement…</div></main>

<div id="lecteur">
  <div class="entete"><b id="l-titre"></b><button class="sec" onclick="fermerLecteur()" data-t="Fermer">Fermer</button></div>
  <div id="pages"></div>
  <div id="barre"><div class="p" id="l-prog"></div><button class="sec" id="l-suiv" onclick="allerSuivante()" data-t="Case suivante ↓">Case suivante ↓</button><button id="l-fin" onclick="terminer()" disabled data-t="Terminer">Terminer</button></div>
</div>

<div id="pad"><div class="boite">
  <b id="pad-titre">Dessinez vos initiales</b><div class="muted" id="pad-aide">Avec le doigt ou la souris.</div>
  <canvas id="toile"></canvas>
  <div class="act"><button class="sec" onclick="effacerPad()" data-t="Effacer">Effacer</button><button class="sec" onclick="fermerPad()" data-t="Annuler">Annuler</button><button onclick="validerPad()" data-t="Apposer">Apposer</button></div>
</div></div>

<script>
(function(){
 const API = 'https://script.google.com/macros/s/AKfycbwSj2ZHUj-0uZojCbJWfeuMCWP-m5tq-2kmzI7VDasiS8HcnjTKfR-pwMxdVXWA2AY/exec';
 function b(s,f){return new Proxy({}, {get(_,k){
  if(k==='withSuccessHandler')return h=>b(h,f); if(k==='withFailureHandler')return h=>b(s,h);
  return (...args)=>fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:k,args})})
   .then(r=>r.json()).then(j=>{ if(j.erreur){ f&&f(new Error(j.erreur)); } else { s&&s(j.resultat); } }).catch(e=>f&&f(e)); }});}
 window.google={script:{run:b(null,null),url:{getLocation:cb=>cb({parameter:Object.fromEntries(new URLSearchParams(location.search))})}}};
})();
</script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let J = null, P = null, PARAM = {};
// ---------------- anglais : le client anglophone voit tout en anglais (la valeur envoyée reste la même) ----------------
const EN = {
  'Votre inspection': 'Your inspection', 'Chargement…': 'Loading…', 'Fermer': 'Close', 'Case suivante ↓': 'Next box ↓',

  'Avec le doigt ou la souris.': 'With your finger or the mouse.',

  'Effacer': 'Clear', 'Annuler': 'Cancel', 'Apposer': 'Place',
  'Impossible d\'ouvrir votre dossier : ': 'Unable to open your file: ',
  'Ce lien n\'est plus valide. Communiquez avec votre inspecteur.': 'This link is no longer valid. Please contact your inspector.',
  'Bonjour': 'Hello', 'Voici les étapes de votre dossier d\'inspection. Tout se fait ici, sur votre téléphone ou votre ordinateur.':
    'Here are the steps for your inspection file. Everything is done here, on your phone or computer.',
  'Signé, merci !': 'Signed, thank you!', 'Reçu, merci !': 'Received, thank you!', 'Remplir': 'Fill in',
  'Lire et signer': 'Read and sign', 'Déposer': 'Upload', 'Ouvrir': 'Open',
  'Vous': 'You', 'Nom complet *': 'Full name *', 'Entreprise (si vous achetez pour une compagnie)': 'Company (if buying for a company)','Téléphone *': 'Phone *', 'Courriel *': 'Email *',
  'Votre adresse actuelle (pour la facture)': 'Your current address (for the invoice)', 'Ville': 'City', 'Code postal': 'Postal code',
  'Un deuxième acheteur ? (facultatif)': 'A second buyer? (optional)', 'Nom': 'Name', 'Courriel': 'Email',
  'L\'immeuble à inspecter': 'The property to inspect', 'Adresse *': 'Address *', 'Ville *': 'City *',
  'Type d\'immeuble': 'Type of property', 'Année de construction (si connue)': 'Year built (if known)',
  'Unifamiliale': 'Single-family', 'Duplex': 'Duplex', 'Triplex': 'Triplex', 'Multilogement': 'Multi-unit',
  'Condominium (copropriété)': 'Condominium', 'Chalet': 'Cottage', 'Autre': 'Other',
  'L\'immeuble est': 'The property is', 'Occupé': 'Occupied', 'Vacant': 'Vacant',
  'Code de boîte à clé (si vacant)': 'Lockbox code (if vacant)', 'Votre courtier (facultatif)': 'Your real estate broker (optional)',
  'Téléphone ou courriel': 'Phone or email', 'Agence': 'Agency', 'Téléphone': 'Phone',
  'J\'autorise mon inspecteur à demander à mon courtier les documents utiles à l\'inspection (déclaration du vendeur, fiche descriptive).':
    'I authorize my inspector to ask my broker for the documents useful to the inspection (seller\'s declaration, listing sheet).',
  'Comment nous avez-vous trouvés ?': 'How did you find us?', 'Choisir…': 'Choose…', 'Mon courtier immobilier': 'My real estate broker',
  'Recherche Google': 'Google search', 'Ami ou famille': 'Friend or family', 'Déjà client': 'Past client',
  'Facebook ou réseaux sociaux': 'Facebook or social media', 'Précisez (facultatif)': 'Details (optional)',
'Le rendez-vous': 'The appointment', 'Entendu : ': 'Agreed: ',
  'Date souhaitée': 'Preferred date', 'Moment': 'Time of day', 'Matin': 'Morning', 'Après-midi': 'Afternoon', 'Peu importe': 'No preference',
  'Je confirme le prix entendu de ': 'I confirm the agreed price of ', ' $ plus taxes.': ' $ plus taxes.',
  'Une précision pour l\'inspecteur ?': 'Anything the inspector should know?', 'Envoyer mes informations': 'Send my information',
  'Envoi…': 'Sending…', 'Envoi impossible : ': 'Unable to send: ',
  'Déclaration du vendeur, fiche descriptive, factures de travaux… (photo ou PDF, 20 Mo au plus).':
    'Seller\'s declaration, listing sheet, renovation invoices… (photo or PDF, 20 MB maximum).',
  ' est trop gros (20 Mo au plus).': ' is too large (20 MB maximum).', 'Envoi de ': 'Sending ', 'Merci, c\'est reçu.': 'Thank you, it\'s received.',
  'Chargement de la page ': 'Loading page ', 'Signer ici': 'Sign here', 'Initiales ici': 'Initials here',
  'Quitter sans terminer ? Vos initiales déjà apposées seront perdues.': 'Leave without finishing? The initials you already placed will be lost.',
  'Case ': 'Box ', ' de ': ' of ', 'page ': 'page ', 'Toutes les cases sont faites.': 'All boxes are done.',
  'Retirer cette marque ?': 'Remove this mark?',
  'Vos informations': 'Your information', 'Lien expiré': 'This link has expired', 'Lien invalide ou expiré.': 'Invalid or expired link.',
  'Pas de courriel pour ce client': 'No email address for this client', 'Accès refusé': 'Access denied', 'Merci ! Votre document est signé. Une copie vous sera envoyée.':
    'Thank you! Your document is signed. A copy will be sent to you.', 'Dessinez d\'abord.': 'Please draw first.',
  // facture et demande de réparation
  'J\'ai payé': 'I have paid', 'Confirmez-vous avoir envoyé le paiement ? Votre inspecteur le vérifiera.': 'Do you confirm you have sent the payment? Your inspector will verify it.',
  'Préparer': 'Prepare', 'Modifier ma demande': 'Edit my request', 'Tous': 'All', 'Majeurs': 'Major', 'Modérés': 'Moderate', 'Mineurs': 'Minor',
  'Majeur': 'Major', 'Modéré': 'Moderate', 'Mineur': 'Minor', 'Autres': 'Other',
  'Réparer': 'Repair', 'Réduction du prix': 'Price reduction', 'Montant demandé ($)': 'Amount requested ($)', 'Note (facultatif)': 'Note (optional)',
  'Total demandé': 'Total requested', 'point(s)': 'item(s)', 'Enregistrer ma demande': 'Save my request', 'Créer le PDF': 'Create the PDF',
  'Demande enregistrée.': 'Request saved.', 'Cochez au moins un point.': 'Check at least one item.',
  'Cette liste est à vous : vous la remplissez et la partagez avec qui vous voulez (votre courtier, par exemple).':
    'This list is yours: you fill it in and share it with whomever you wish (your broker, for example).',
  'Demande de réparation ou de réduction du prix': 'Request for repairs or price reduction',
  'Propriété': 'Property', 'Préparée par': 'Prepared by', 'Date': 'Date', 'Point': 'Item', 'Demande': 'Request', 'Montant': 'Amount',
  'Préparée à partir du rapport d\'inspection de ': 'Prepared from the inspection report by ', ', dossier ': ', file ',
};
const enAnglais = () => !!(P && P.langue === 'en');
const t = (s) => (enAnglais() && EN[s] !== undefined ? EN[s] : s);
// libellés des cases de la convention APCHQ
const tCase = (s) => (!enAnglais() ? s : String(s).replace(/^Article/, 'Section').replace('Bas de la page', 'Bottom of page')
  .replace(/^Annexe/, 'Schedule').replace('Attestation', 'Certificate'));
function traduirePage() {
  document.documentElement.lang = enAnglais() ? 'en' : 'fr';
  document.querySelectorAll('[data-t]').forEach((x) => { x.textContent = t(x.dataset.t); });
}


const appareil = navigator.userAgent;

function run(fn, ...args) {
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
}

google.script.url.getLocation((loc) => {
  PARAM = loc.parameter || {};
  J = PARAM.j;
  charger(true);
});

async function charger(premiere) {
  try { P = await run('clientLire', J); } catch (e) { $('#m').innerHTML = `<div class="carte">${t("Impossible d'ouvrir votre dossier : ")}${esc(t(e.message))}</div>`; return; }
  if (!P) { $('#m').innerHTML = `<div class="carte">${t("Ce lien n'est plus valide. Communiquez avec votre inspecteur.")}</div>`; return; }
  traduirePage();
  if (premiere) run('clientVu', J).catch(() => {});
  document.documentElement.style.setProperty('--a', P.couleur || '#1f5f8b');
  $('#titre').textContent = P.entreprise || t('Votre inspection');
  const d = P.dossier || {};
  $('#sous').textContent = [d.adresse, d.date ? dateLongue(d.date) + (d.heure ? (enAnglais() ? ' at ' : ' à ') + heureTxt(d.heure) : '') : ''].filter(Boolean).join(' · ');
  dessiner();
  // lien direct vers un document (ex. attestation signée sur place)
  if (premiere && PARAM.doc) { const e = (P.etapes || []).find((x) => x.cle === PARAM.doc || String(x.doc_id) === String(PARAM.doc)); if (e && e.doc_id && e.etat !== 'signe') ouvrirLecteur(e); }
}

function heureTxt(h) {
  if (!h) return ''; const [a, b] = h.split(':');
  if (enAnglais()) { const n = Number(a); return ((n + 11) % 12 + 1) + ':' + (b || '00') + (n < 12 ? ' a.m.' : ' p.m.'); }
  return Number(a) + ' h' + (b && b !== '00' ? ' ' + b : '');
}
function dateLongue(s) {
  const [y, m, j] = s.split('-').map(Number);
  return new Date(y, m - 1, j).toLocaleDateString(enAnglais() ? 'en-CA' : 'fr-CA', { weekday: 'long', day: 'numeric', month: 'long' });
}

function dessiner() {
  const E = P.etapes || [];
  let h = `<div class="carte"><h2>${t('Bonjour')}${P.client && P.client.nom ? ' ' + esc(P.client.nom.split(' ')[0]) : ''},</h2>
    <div class="muted">${t("Voici les étapes de votre dossier d'inspection. Tout se fait ici, sur votre téléphone ou votre ordinateur.")}</div></div>`;
  E.forEach((e, i) => {
    const fait = ['recu', 'signe', 'fait'].includes(e.etat);
    h += `<div class="carte"><div class="etape ${fait ? 'fait' : 'afaire'}"><div class="n">${fait ? '✓' : i + 1}</div>
      <div class="t"><b>${esc(t(e.titre))}</b><span>${esc(e.sous ? t(e.sous) : (fait ? (e.etat === 'signe' ? t('Signé, merci !') : t('Reçu, merci !')) : ''))}</span></div>
      ${!fait && e.cle === 'fiche' ? `<button onclick="ouvrirFiche()">${t('Remplir')}</button>` : ''}
      ${!fait && e.doc_id ? `<button onclick="ouvrirLecteur(P.etapes[${i}])">${t('Lire et signer')}</button>` : ''}
      ${e.cle === 'documents' ? `<button onclick="ouvrirDepot()">${t('Déposer')}</button>` : ''}
      ${e.lien ? `<a class="btn" href="${esc(e.lien)}" target="_blank">${t('Ouvrir')}</a>` : ''}
      ${e.cle === 'facture' && e.paiement ? `<button class="sec" onclick="jaiPaye()">${t("J'ai payé")}</button>` : ''}
      ${e.cle === 'demande' ? `<button onclick="ouvrirDemande()">${t(fait ? 'Modifier ma demande' : 'Préparer')}</button>` : ''}
    </div><div id="z-${esc(e.cle)}"></div></div>`;
  });
  $('#m').innerHTML = h;
  if (E.find((e) => e.cle === 'fiche' && e.etat === 'a_faire') && E.length === 1) ouvrirFiche();
}

// ---------------- fiche ----------------
function ouvrirFiche() {
  const c = P.client || {}, d = P.dossier || {}, f = P.fiche_recue || {};
  const v = (k, def = '') => esc(f[k] ?? def);
  const z = $('#z-fiche');
  z.innerHTML = `<form id="fiche" onsubmit="envoyerFiche(event)">
    <h3>${t("Vous")}</h3>
    <label>${t("Nom complet *")}</label><input name="nom" required value="${v('nom', c.nom)}">
    <label>${t("Entreprise (si vous achetez pour une compagnie)")}</label><input name="entreprise" value="${v('entreprise', c.entreprise)}">
    <div class="deux"><div><label>${t("Téléphone *")}</label><input name="telephone" type="tel" required value="${v('telephone', c.telephone)}"></div>
      <div><label>${t("Courriel *")}</label><input name="courriel" type="email" required value="${v('courriel', c.courriel)}"></div></div>
    <label>${t("Votre adresse actuelle (pour la facture)")}</label><input name="adresse_client" value="${v('adresse_client')}">
    <div class="deux"><div><label>${t("Ville")}</label><input name="ville_client" value="${v('ville_client')}"></div><div><label>${t("Code postal")}</label><input name="cp_client" value="${v('cp_client')}"></div></div>
    <h3>${t("Un deuxième acheteur ? (facultatif)")}</h3>
    <div class="deux"><div><label>${t("Nom")}</label><input name="co_nom" value="${v('co_nom')}"></div><div><label>${t("Courriel")}</label><input name="co_courriel" type="email" value="${v('co_courriel')}"></div></div>
    <h3>${t("L'immeuble à inspecter")}</h3>
    <label>${t("Adresse *")}</label><input name="adresse" required value="${v('adresse', d.adresse)}">
    <div class="deux"><div><label>${t("Ville *")}</label><input name="ville" required value="${v('ville', d.ville)}"></div><div><label>${t("Code postal")}</label><input name="cp" value="${v('cp')}"></div></div>
    <div class="deux"><div><label>${t("Type d'immeuble")}</label><select name="immeuble">${['Unifamiliale', 'Duplex', 'Triplex', 'Multilogement', 'Condominium (copropriété)', 'Chalet', 'Autre'].map((x) => `<option value="${x}" ${f.immeuble === x ? 'selected' : ''}>${t(x)}</option>`).join('')}</select></div>
      <div><label>${t("Année de construction (si connue)")}</label><input name="annee" value="${v('annee')}"></div></div>
    <div class="deux"><div><label>${t("L'immeuble est")}</label><select name="occupation">${['Occupé', 'Vacant'].map((x) => `<option value="${x}" ${f.occupation === x ? 'selected' : ''}>${t(x)}</option>`).join('')}</select></div>
      <div><label>${t("Code de boîte à clé (si vacant)")}</label><input name="boite_cle" value="${v('boite_cle')}"></div></div>
    <h3>${t("Votre courtier (facultatif)")}</h3>
    <div class="deux"><div><label>${t("Nom")}</label><input name="courtier_nom" value="${v('courtier_nom')}"></div><div><label>${t("Agence")}</label><input name="courtier_agence" value="${v('courtier_agence')}"></div></div>
    <div class="deux"><div><label>${t("Téléphone")}</label><input name="courtier_tel" type="tel" value="${v('courtier_tel', /@/.test(f.courtier_contact || '') ? '' : (f.courtier_contact || ''))}"></div>
      <div><label>${t("Courriel")}</label><input name="courtier_courriel" type="email" value="${v('courtier_courriel', /@/.test(f.courtier_contact || '') ? f.courtier_contact : '')}"></div></div>

function pos(e) { const r = $('#toile').getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return [t.clientX - r.left, t.clientY - r.top]; }
const cv = $('#toile');

  $('#pad').style.display = 'none';
  if (CASE_EN_COURS) apposer(CASE_EN_COURS, image);
}

<script>
// Téléphone : mis en forme tout seul, (819) 744-0563, peu importe comment il est tapé (téléphone et ordinateur).
(function () {
  const forme = (v) => {
    if (/^\s*\+(?!\s*1)/.test(v)) return v;             // numéro étranger (+33…) : on n'y touche pas
    let d = v.replace(/\D/g, '');
    if (d[0] === '1') d = d.slice(1);                    // +1 / 1 du début : enlevé (aucun indicatif ne commence par 1)
    if (d.length > 10) return v;                         // poste ou autre : laissé tel quel
    if (!d) return '';
    if (d.length <= 3) return '(' + d;
    if (d.length <= 6) return '(' + d.slice(0, 3) + ') ' + d.slice(3);
    return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
  };
  const estTel = (el) => el && el.tagName === 'INPUT' && (el.type === 'tel' || /^(telephone|tel|client_tel|co_telephone|telephone_client)$/.test(el.name || el.id));
  document.addEventListener('input', (e) => {
    const el = e.target; if (!estTel(el)) return;
    el.setCustomValidity(''); el.style.borderColor = '';
    if (/^delete/.test(e.inputType || '')) return;       // en effaçant, on laisse faire ; remis en forme en sortant du champ
    if (el.selectionStart !== el.value.length) return;   // correction au milieu : remis en forme en sortant du champ
    el.value = forme(el.value);
  }, true);
  document.addEventListener('blur', (e) => {
    const el = e.target; if (!estTel(el) || !el.value.trim()) return;
    el.value = forme(el.value);
    const n = el.value.replace(/\D/g, '').replace(/^1/, '').length;
    if (!/^\s*\+/.test(el.value) && n > 0 && n < 10) {
      el.setCustomValidity(document.documentElement.lang === 'en' ? 'Incomplete number: 10 digits' : 'Numéro incomplet : 10 chiffres');
      el.style.borderColor = '#c0392b';
    }
  }, true);
})();
</script>
<script>
// Adresse à la québécoise : « 25, rue Laurier », « 56, route 309 Sud » (Google donne « 25 Rue Laurier », « 56 Québec 309 »).
window.adresseQuebec = function (a, tape) {
  const m = String(a.adresse || '').match(/^(\d+[A-Za-z]?(?:-\d+)?)\s+(.+)$/);
  let num = m ? m[1] : '', rue = m ? m[2] : String(a.adresse || '');
  rue = rue.replace(/^(?:Québec|Quebec|QC|Qc|Route|Rte)[\s-]+(\d+)/i, 'route $1');
  rue = rue.replace(/^(Rue|Chemin|Route|Avenue|Boulevard|Montée|Rang|Impasse|Place|Croissant|Côte|Allée|Promenade|Terrasse|Carré|Ruelle|Sentier|Montee|Cote)\b/, (w) => w.toLowerCase());
  rue = rue.replace(/^(\S+) (De La|De L'|De l'|Du|Des|De|D')(?=[ A-ZÀ-Ý])/, (t, g, p) => g + ' ' + p.toLowerCase());
  const dir = String(tape || '').match(/\b(nord|sud|est|ouest)\s*$/i) || String(tape || '').match(/\d+\s*(?:nord|sud|est|ouest)?\s+(nord|sud|est|ouest)\b/i);
  const mots = rue.toLowerCase().replace(/[^a-zà-ÿ]+/g, ' ').split(' ');
  if (dir && mots.indexOf(dir[1].toLowerCase()) < 0) rue += ' ' + dir[1].charAt(0).toUpperCase() + dir[1].slice(1).toLowerCase();
  return Object.assign({}, a, { adresse: num ? num + ', ' + rue : rue });
};
// Mapbox (comme Habita) : jusqu'à 5 vraies adresses pendant qu'on tape, près de l'Outaouais d'abord.
window.chercherMapbox = async function (q, jeton, langue) {
  if (!jeton) return [];
  const u = 'https://api.mapbox.com/geocoding/v5/mapbox.places/' + encodeURIComponent(q) + '.json?access_token=' + encodeURIComponent(jeton) +
    '&country=ca&types=address&autocomplete=true&limit=5&proximity=-75.45,45.65&language=' + (langue === 'en' ? 'en' : 'fr');
  const r = await fetch(u);
  if (!r.ok) return [];
  const d = await r.json();
  return (d.features || []).map((f) => {
    const c = (t) => ((f.context || []).find((x) => String(x.id || '').indexOf(t + '.') === 0) || {}).text || '';
    return { texte: String(f.place_name || '').replace(/, Canada$/, ''), adresse: [f.address, f.text].filter(Boolean).join(' '),
      ville: c('place') || c('locality'), cp: c('postcode'), lat: f.center && f.center[1], lng: f.center && f.center[0] };
  });
};
// Adresses : suggestions pendant qu'on tape. Téléphone et ordinateur.
// suggestionsAdresse(champ, chercher(texte) -> Promise<[{texte, adresse, ville, cp}]>, remplir(a))
window.suggestionsAdresse = function (champ, chercher, remplir) {
  if (!champ || champ.dataset.sugg) return;
  champ.dataset.sugg = '1';
  champ.setAttribute('autocomplete', 'off');
  let minut = null, boite = null, n = 0;
  const fermer = () => { if (boite) { boite.remove(); boite = null; } };
  const ouvrir = (liste) => {
    fermer();
    if (!liste.length) return;
    boite = document.createElement('div');
    boite.setAttribute('role', 'listbox');
    boite.style.cssText = 'border:1px solid #c9d3dc;border-radius:8px;margin:4px 0 8px;background:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)';
    liste.forEach((a, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = '📍 ' + a.texte;
      b.style.cssText = 'display:block;width:100%;text-align:left;padding:11px 12px;border:0;' + (i ? 'border-top:1px solid #eef1f4;' : '') +
        'background:#fff;color:#1d2731;font:inherit;font-size:15px;font-weight:400;cursor:pointer;margin:0;border-radius:0';
      b.onmousedown = (e) => e.preventDefault();          // garder le champ actif pendant le clic
      b.onclick = () => { fermer(); remplir(window.adresseQuebec ? window.adresseQuebec(a, champ.value) : a); };
      b.onmouseenter = () => { b.style.background = '#f1f6fa'; };
      b.onmouseleave = () => { b.style.background = '#fff'; };
      boite.appendChild(b);
    });
    champ.insertAdjacentElement('afterend', boite);
  };
  champ.addEventListener('input', () => {
    clearTimeout(minut);
    const q = champ.value.trim();
    if (q.length < 6) { fermer(); return; }
    minut = setTimeout(async () => {
      const moi = ++n;
      let r = [];
      try { r = (await chercher(q)) || []; } catch (e) { return; }
      if (moi !== n || champ.value.trim() !== q || document.activeElement !== champ) return;
      ouvrir(r);
    }, 550);
  });
  champ.addEventListener('blur', () => setTimeout(fermer, 200));
  champ.addEventListener('keydown', (e) => { if (e.key === 'Escape') fermer(); });
};
</script>
